<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>WISSENSDUELL</title>
<style>
  :root{
    --bg:#0a0d16; --bg-alt:#10141f; --panel:#151b2b; --panel-2:#1c2338; --line:#262e46;
    --text:#eef0fb; --text-dim:#9aa3c0; --accent:#7c6cf0; --accent-2:#21d6b8;
    --danger:#ff4d6a; --warn:#ffb443;
    --rank-none:#6b7280; --rank-listed:#7f93c2; --rank-bronze:#b6754a; --rank-silver:#b9c1d4;
    --rank-gold:#e3b23c; --rank-diamond:#3fd0e0; --rank-platin:#bfe3e0; --rank-master:#e0466e; --rank-grand:#f2c14e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a2140 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #14243a 0%, transparent 55%),
      var(--bg);
    color:var(--text); font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100%;
  }
  #app{ max-width:960px; margin:0 auto; padding:20px 16px 60px; }
  .hidden{ display:none !important; }

  .statusbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .score-block{ position:relative; display:flex; align-items:baseline; gap:8px; }
  .score-num{ font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .score-label{ font-size:12px; color:var(--text-dim); }
  .rank-pill{ display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px; font-weight:700; font-size:13px; border:1px solid var(--line); }
  .rank-dot{ width:8px; height:8px; border-radius:50%; }
  .rank-none{color:var(--rank-none); border-color:color-mix(in srgb,var(--rank-none) 45%,var(--line));}
  .rank-listed{color:var(--rank-listed); border-color:color-mix(in srgb,var(--rank-listed) 45%,var(--line));}
  .rank-bronze{color:var(--rank-bronze); border-color:color-mix(in srgb,var(--rank-bronze) 45%,var(--line));}
  .rank-silver{color:var(--rank-silver); border-color:color-mix(in srgb,var(--rank-silver) 45%,var(--line));}
  .rank-gold{color:var(--rank-gold); border-color:color-mix(in srgb,var(--rank-gold) 45%,var(--line));}
  .rank-diamond{color:var(--rank-diamond); border-color:color-mix(in srgb,var(--rank-diamond) 45%,var(--line));}
  .rank-platin{color:var(--rank-platin); border-color:color-mix(in srgb,var(--rank-platin) 45%,var(--line));}
  .rank-master{color:var(--rank-master); border-color:color-mix(in srgb,var(--rank-master) 45%,var(--line));}
  .rank-grand{color:var(--rank-grand); border-color:color-mix(in srgb,var(--rank-grand) 45%,var(--line)); box-shadow:0 0 14px color-mix(in srgb,var(--rank-grand) 35%,transparent);}
  .rank-none .rank-dot{background:var(--rank-none);} .rank-listed .rank-dot{background:var(--rank-listed);}
  .rank-bronze .rank-dot{background:var(--rank-bronze);} .rank-silver .rank-dot{background:var(--rank-silver);}
  .rank-gold .rank-dot{background:var(--rank-gold);} .rank-diamond .rank-dot{background:var(--rank-diamond);}
  .rank-platin .rank-dot{background:var(--rank-platin);} .rank-master .rank-dot{background:var(--rank-master);}
  .rank-grand .rank-dot{background:var(--rank-grand);}

  .panel{ background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--line); border-radius:18px; padding:22px; }

  /* Hauptmenü */
  .menu-hero{ text-align:center; margin: 30px 0 26px; }
  .menu-hero h1{
    font-size:42px; margin:0 0 8px; letter-spacing:-1px;
    background:linear-gradient(120deg,var(--text) 30%,var(--accent-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .menu-hero p{ color:var(--text-dim); margin:0; font-size:14px; }
  .menu-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:14px; }
  @media (max-width:900px){ .menu-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:600px){ .menu-grid{ grid-template-columns:1fr; } }
  .mode-card{
    background:var(--bg-alt); border:1.5px solid var(--line); border-radius:16px;
    padding:26px 20px; text-align:left; cursor:pointer; color:var(--text);
    transition:border-color .15s ease, transform .1s ease;
  }
  .mode-card:hover{ border-color:var(--accent); }
  .mode-card:active{ transform:scale(0.98); }
  .mode-card .icon{ font-size:26px; margin-bottom:10px; }
  .mode-card h3{ margin:0 0 6px; font-size:19px; }
  .mode-card p{ margin:0; color:var(--text-dim); font-size:13px; line-height:1.5; }
  .menu-secondary{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .btn{ appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:15px; border-radius:14px; padding:14px 24px; transition:transform .12s ease, box-shadow .12s ease, background .2s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(120deg,var(--accent),#5a4bd8); color:white; box-shadow:0 10px 24px -8px rgba(124,108,240,.6); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* Profilauswahl */
  .picker-title{ font-size:20px; font-weight:800; margin:0 0 4px; }
  .picker-sub{ color:var(--text-dim); font-size:13px; margin:0 0 18px; }
  .picker-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .picker-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-alt); border:1.5px solid var(--line); border-radius:12px;
    padding:14px 16px; cursor:pointer; color:var(--text); font-weight:700; font-size:15px;
  }
  .picker-item:hover{ border-color:var(--accent); }
  .picker-item .sub{ font-size:12px; color:var(--text-dim); font-weight:500; }
  .picker-form{ display:flex; gap:8px; margin-top:6px; }
  .picker-form input{
    flex:1; background:var(--bg-alt); border:1.5px solid var(--line); border-radius:12px;
    padding:12px 14px; color:var(--text); font-size:15px; font-family:inherit;
  }
  .picker-form input:focus{ outline:none; border-color:var(--accent); }
  .slot-progress{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .slot-chip{ font-size:12px; padding:5px 12px; border-radius:999px; background:var(--bg-alt); border:1px solid var(--line); color:var(--text-dim); }
  .slot-chip.filled{ color:var(--accent-2); border-color:var(--accent-2); }

  .count-options{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:8px; }
  .count-btn{ background:var(--bg-alt); border:1.5px solid var(--line); border-radius:14px; padding:22px 10px; text-align:center; cursor:pointer; color:var(--text); font-weight:800; font-size:20px; }
  .count-btn span{ display:block; font-size:11px; font-weight:600; color:var(--text-dim); margin-top:4px; }
  .count-btn:hover{ border-color:var(--accent); }

  /* Spiel */
  .qmeta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .qcount{ font-size:13px; color:var(--text-dim); font-weight:600; }
  .qcat{ font-size:12px; padding:4px 10px; border-radius:999px; background:var(--bg-alt); border:1px solid var(--line); color:var(--accent-2); font-weight:700; }
  .timer-wrap{ margin-bottom:16px; }
  .timer-bar{ height:8px; background:var(--bg-alt); border-radius:999px; overflow:hidden; border:1px solid var(--line); }
  .timer-fill{ height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition:width .2s linear, background .3s ease; }
  .timer-fill.warn{ background:linear-gradient(90deg,var(--warn),var(--danger)); }
  .timer-num{ font-size:12px; color:var(--text-dim); margin-top:5px; text-align:right; font-variant-numeric:tabular-nums; }
  .question-text{ font-size:20px; font-weight:700; line-height:1.4; margin:6px 0 20px; }
  .answers{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .answers{ grid-template-columns:1fr; } }
  .answer-btn{
    text-align:left; background:var(--bg-alt); color:var(--text); border:1.5px solid var(--line);
    border-radius:14px; padding:16px 18px; font-size:15px; font-weight:600; cursor:pointer; min-height:64px;
    display:flex; align-items:center; gap:10px; transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .answer-btn:hover:not(:disabled){ border-color:var(--accent); }
  .answer-btn:active:not(:disabled){ transform:scale(0.985); }
  .answer-btn:disabled{ cursor:default; }
  .answer-letter{ width:26px; height:26px; border-radius:8px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--text-dim); flex-shrink:0; }
  .answer-btn.correct{ background:color-mix(in srgb,var(--accent-2) 22%,var(--bg-alt)); border-color:var(--accent-2); }
  .answer-btn.wrong{ background:color-mix(in srgb,var(--danger) 22%,var(--bg-alt)); border-color:var(--danger); }
  .answer-btn.correct .answer-letter{ background:var(--accent-2); color:#06231e; }
  .answer-btn.wrong .answer-letter{ background:var(--danger); color:#2b0710; }
  .explanation{ margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--bg-alt); border:1px solid var(--line); font-size:13.5px; color:var(--text-dim); line-height:1.5; }
  .next-hint{ margin-top:14px; font-size:12px; color:var(--text-dim); text-align:right; }

  .avatar-circle{ width:34px; height:34px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:white; }

  /* Pass & Play */
  .pass-card{ text-align:center; padding:60px 20px; }
  .pass-card .avatar-big{ width:72px; height:72px; border-radius:20px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; color:white; }
  .pass-card h2{ font-size:24px; margin:0 0 8px; }
  .pass-card p{ color:var(--text-dim); font-size:14px; margin:0 0 26px; }

  .confirm-card{ text-align:center; padding:50px 20px; }
  .points-badge{ display:inline-block; font-size:34px; font-weight:800; padding:6px 18px; border-radius:14px; animation:floatUp .5s ease; }
  .points-badge.pos{ color:var(--accent-2); }
  .points-badge.neg{ color:var(--danger); }
  @keyframes floatUp{ from{ transform:translateY(10px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

  .resolve-list{ display:flex; flex-direction:column; gap:10px; margin:18px 0; }
  .resolve-row{ display:flex; justify-content:space-between; align-items:center; background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-weight:700; }
  .resolve-row .mark{ font-size:18px; }
  .resolve-row .mark.ok{ color:var(--accent-2); }
  .resolve-row .mark.bad{ color:var(--danger); }

  .result-title{ font-size:26px; font-weight:800; margin:0 0 4px; }
  .result-sub{ color:var(--text-dim); font-size:14px; margin:0 0 22px; }
  .result-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px; }
  .result-item{ background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .result-item .n{ font-size:22px; font-weight:800; }
  .result-item .l{ font-size:11px; color:var(--text-dim); }
  .result-item.pos .n{ color:var(--accent-2); }
  .result-item.neg .n{ color:var(--danger); }
  .rank-up-banner{ margin-bottom:18px; padding:14px 16px; border-radius:12px; background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 25%,var(--bg-alt)),color-mix(in srgb,var(--accent-2) 20%,var(--bg-alt))); border:1px solid var(--accent); font-size:14px; font-weight:700; }
  .actions-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .leaderboard-row{ display:flex; align-items:center; gap:12px; background:var(--bg-alt); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .leaderboard-row .medal{ font-size:22px; width:30px; text-align:center; flex-shrink:0; }
  .leaderboard-row .lname{ font-weight:800; font-size:15px; }
  .leaderboard-row .lsub{ font-size:12px; color:var(--text-dim); }
  .leaderboard-row .lright{ margin-left:auto; text-align:right; }
  .leaderboard-row .lpoints{ font-weight:800; font-size:17px; }

  .stat-card{ background:var(--bg-alt); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; }
  .stat-card .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .stat-card .sname{ font-weight:800; font-size:16px; }
  .stat-mini{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-mini div{ background:var(--panel-2); border-radius:10px; padding:8px; text-align:center; }
  .stat-mini .n{ font-weight:800; font-size:15px; }
  .stat-mini .l{ font-size:10px; color:var(--text-dim); }

  footer{ text-align:center; color:var(--text-dim); font-size:11px; margin-top:36px; }

  /* ---------- Party (WLAN) ---------- */
  .code-display{ font-size:44px; font-weight:800; letter-spacing:6px; text-align:center; margin:14px 0; color:var(--accent-2); }
  .party-players{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .party-player-row{ display:flex; align-items:center; gap:10px; background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  .party-player-row .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent-2); flex-shrink:0; }
  .party-player-row.offline .dot{ background:var(--text-dim); }
  .party-player-row .team-tag{ margin-left:auto; font-size:11px; padding:3px 9px; border-radius:999px; background:var(--panel-2); color:var(--text-dim); }
  .bot-tier-select{ margin-left:auto; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:11px; font-family:inherit; }
  .bot-remove-btn{ background:transparent; border:1px solid var(--line); color:var(--danger); border-radius:8px; width:26px; height:26px; cursor:pointer; font-size:13px; flex-shrink:0; }
  .bot-remove-btn:hover{ border-color:var(--danger); }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .label{ font-weight:700; font-size:14px; }
  .chip-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip-btn{ background:var(--bg-alt); border:1.5px solid var(--line); border-radius:999px; padding:7px 16px; font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer; }
  .chip-btn.active{ color:var(--text); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--bg-alt)); }
  .round-plan-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .round-plan-item{ display:flex; align-items:center; gap:10px; background:var(--bg-alt); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; }
  .round-plan-item .idx{ width:22px; height:22px; border-radius:6px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
  .round-plan-item select{ margin-left:auto; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:12px; font-family:inherit; }
  .team-slots{ display:flex; flex-direction:column; gap:14px; margin-top:10px; }
  .team-slot-card{ background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .team-slot-card h5{ margin:0 0 8px; font-size:13px; color:var(--accent-2); }
  .team-slot-card .members{ display:flex; gap:6px; flex-wrap:wrap; }
  .team-member-btn{ font-size:12px; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer; }
  .team-member-btn.taken{ opacity:0.35; cursor:default; }
  .turn-banner{ text-align:center; padding:14px; border-radius:14px; background:color-mix(in srgb, var(--accent) 20%, var(--bg-alt)); border:1px solid var(--accent); font-weight:800; margin-bottom:16px; }
  .hearts{ display:flex; gap:4px; }
  .heart{ font-size:16px; opacity:0.25; }
  .heart.on{ opacity:1; }
  .rank-board{ display:flex; flex-direction:column; gap:8px; margin:16px 0; }
  .rank-slot{ height:6px; }
  .rank-item-row{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-weight:700; }
  .rank-item-row .val{ color:var(--accent-2); font-weight:800; }
  .insert-btn{ width:100%; background:transparent; border:1.5px dashed var(--line); border-radius:10px; padding:8px; color:var(--text-dim); font-size:12px; font-weight:700; cursor:pointer; }
  .insert-btn:hover{ border-color:var(--accent); color:var(--text); }
  .current-item-card{ text-align:center; padding:22px; background:var(--bg-alt); border:1.5px solid var(--accent); border-radius:14px; margin-bottom:16px; }
  .current-item-card .name{ font-size:20px; font-weight:800; margin-top:6px; }
  .lives-row{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-alt); border:1px solid var(--line); border-radius:10px; padding:8px 14px; margin-bottom:8px; font-size:13px; }
  .party-waiting{ text-align:center; padding:60px 20px; color:var(--text-dim); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   WISSENSDUELL — Solo & Lokaler Multiplayer (Pass & Play)
   Komplett clientseitig, kein Backend. Fortschritt in localStorage.
   ========================================================================= */

/* ---------------------------- 1. FRAGENPOOL (zentral, für Solo & MP) ---------------------------- */
const QUESTIONS = [
{q:"Welcher ist der größte Ozean der Erde?",a:["Atlantik","Pazifik","Indischer Ozean","Arktischer Ozean"],c:1,cat:"Geografie",d:1,e:"Der Pazifik bedeckt rund ein Drittel der Erdoberfläche."},
{q:"Welcher Fluss gilt traditionell als der längste der Welt?",a:["Amazonas","Jangtse","Nil","Mississippi"],c:2,cat:"Geografie",d:2,e:"Je nach Messmethode wird teils auch der Amazonas als längster Fluss gezählt."},
{q:"Welcher ist der kleinste Kontinent?",a:["Europa","Australien","Antarktis","Südamerika"],c:1,cat:"Geografie",d:1},
{q:"In welcher Region liegt die Sahara hauptsächlich?",a:["Naher Osten","Nordafrika","Südliches Afrika","Zentralasien"],c:1,cat:"Geografie",d:1},
{q:"Wie heißt der höchste Berg Afrikas?",a:["Mount Kenya","Kilimandscharo","Atlasgebirge","Ruwenzori"],c:1,cat:"Geografie",d:2},
{q:"Welches Land hat durch seine Überseegebiete die meisten Zeitzonen weltweit?",a:["Russland","USA","Frankreich","China"],c:2,cat:"Geografie",d:3,e:"Frankreich kommt durch seine Überseegebiete auf 12 Zeitzonen."},
{q:"In welchem Jahr endete der Zweite Weltkrieg?",a:["1943","1944","1945","1946"],c:2,cat:"Geschichte",d:1},
{q:"Wer war der erste Bundeskanzler der Bundesrepublik Deutschland?",a:["Konrad Adenauer","Ludwig Erhard","Willy Brandt","Helmut Kohl"],c:0,cat:"Geschichte",d:1},
{q:"In welchem Jahr fiel die Berliner Mauer?",a:["1987","1989","1991","1993"],c:1,cat:"Geschichte",d:1},
{q:"In welchem Jahr begann die Französische Revolution?",a:["1776","1789","1799","1804"],c:1,cat:"Geschichte",d:2},
{q:"Wer entdeckte 1492 aus europäischer Sicht Amerika?",a:["Vasco da Gama","Christoph Kolumbus","Ferdinand Magellan","James Cook"],c:1,cat:"Geschichte",d:1},
{q:"Welches Reich wurde im Jahr 476 n. Chr. gestürzt?",a:["Byzantinisches Reich","Weströmisches Reich","Perserreich","Frankenreich"],c:1,cat:"Geschichte",d:3},
{q:"Wie viele Bundesländer hat Deutschland?",a:["13","15","16","18"],c:2,cat:"Politik",d:1},
{q:"Wo befindet sich der Sitz der UNO-Hauptversammlung?",a:["Genf","New York","Brüssel","Den Haag"],c:1,cat:"Politik",d:1},
{q:"Wie heißt das deutsche Parlament?",a:["Bundesrat","Bundestag","Landtag","Reichstag"],c:1,cat:"Politik",d:1},
{q:"Welche Staatsform hat Deutschland?",a:["Präsidialrepublik","Parlamentarische Republik","Konstitutionelle Monarchie","Einparteienstaat"],c:1,cat:"Politik",d:2},
{q:"Wie viele Mitgliedsstaaten hat die Europäische Union?",a:["25","27","28","30"],c:1,cat:"Politik",d:2},
{q:"Welches Land hat KEIN ständiges Vetorecht im UN-Sicherheitsrat?",a:["Russland","China","Deutschland","Frankreich"],c:2,cat:"Politik",d:3},
{q:"Welches chemische Symbol steht für Gold?",a:["Ag","Au","Gd","Go"],c:1,cat:"Wissenschaft",d:1},

/* ---------------------------- 2. RANGSYSTEM (zentral) ---------------------------- */
const RANKS = [
  {name:"Nicht gelistet", min:0,     max:999,     cls:"rank-none"},
  {name:"Gelistet",       min:1000,  max:1499,    cls:"rank-listed"},
  {name:"Bronze",         min:1500,  max:2499,    cls:"rank-bronze"},
  {name:"Silber",         min:2500,  max:3999,    cls:"rank-silver"},
  {name:"Gold",           min:4000,  max:5999,    cls:"rank-gold"},
  {name:"Diamant",        min:6000,  max:7999,    cls:"rank-diamond"},
  {name:"Platin",         min:8000,  max:9999,    cls:"rank-platin"},
  {name:"Meister",        min:10000, max:14999,   cls:"rank-master"},
  {name:"Großmeister",    min:15000, max:Infinity,cls:"rank-grand"}
];
function getRank(score){ return RANKS.find(r => score >= r.min && score <= r.max) || RANKS[0]; }
function getNextRankInfo(score){
  const idx = RANKS.findIndex(r => score >= r.min && score <= r.max);
  if(idx === -1 || idx === RANKS.length - 1) return null;
  const next = RANKS[idx+1];
  return { next, pointsNeeded: next.min - score };
}
function rankPillHtml(score){
  const rank = getRank(score);
  return `<span class="rank-pill ${rank.cls}"><span class="rank-dot"></span>${rank.name}</span>`;
}

/* ------------------------- 3. ZEIT & SCHWIERIGKEIT (zentral) ------------------------- */
function getTimeLimit(score){
  if(score < 1000) return 100;
  if(score < 2500) return 50;
  if(score < 4000) return 30;
  if(score < 6000) return 25;
  if(score < 8000) return 20;
  if(score < 10000) return 15;
  return 10;
}
function getDifficultyWeights(score){
  if(score < 1500) return [0.72, 0.24, 0.04];
  if(score < 4000) return [0.35, 0.5, 0.15];
  if(score < 8000) return [0.15, 0.45, 0.4];
  return [0.05, 0.25, 0.7];
}
function weightedDifficulty(weights){
  const r = Math.random();
  if(r < weights[0]) return 1;
  if(r < weights[0]+weights[1]) return 2;
  return 3;
}
let recentQuestions = [];
function pickQuestionsForRound(baseScore){
  const weights = getDifficultyWeights(baseScore);
  const usedIds = new Set();
  const recentSet = new Set(recentQuestions);
  const picks = [];
  for(let i=0;i<5;i++){
    const diff = weightedDifficulty(weights);
    let pool = QUESTIONS.map((q,idx)=>({...q,idx})).filter(q=>q.d===diff && !usedIds.has(q.idx) && !recentSet.has(q.idx));
    if(pool.length===0) pool = QUESTIONS.map((q,idx)=>({...q,idx})).filter(q=>q.d===diff && !usedIds.has(q.idx));
    if(pool.length===0) pool = QUESTIONS.map((q,idx)=>({...q,idx})).filter(q=>!usedIds.has(q.idx));
    const chosen = pool[Math.floor(Math.random()*pool.length)];
    usedIds.add(chosen.idx);
    picks.push(chosen);
  }
  recentQuestions = [...picks.map(p=>p.idx), ...recentQuestions].slice(0,40);
  return picks;
}

/* ------------------------------ 4. PROFILE / SPEICHERUNG ---------------------------- */
const PROFILES_KEY = "wissensduell_profiles_v1";
let profiles = [];
function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    profiles = raw ? JSON.parse(raw) : [];
  }catch(e){ profiles = []; }
}
function saveProfiles(){
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); }catch(e){}
}
function createProfile(name){
  const p = { id:"p_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name: name.trim(), score:0, roundsPlayed:0, wins:0, losses:0,
    correctAnswers:0, wrongAnswers:0, bestScore:0 };
  profiles.push(p);
  saveProfiles();
  return p;
}
function applyPoints(profile, delta){
  profile.score = Math.max(0, profile.score + delta);
  profile.bestScore = Math.max(profile.bestScore, profile.score);
  saveProfiles();
}
loadProfiles();

function initials(name){ return name.trim().slice(0,2).toUpperCase(); }

  return `

      <div class="score-block"><div class="score-num">${score}</div><div class="score-label">Punkte</div></div>

}

/* ============================================================================
   SOLO-MODUS
   ============================================================================ */
let solo = null;

function startSoloFlow(){
  renderProfilePicker("WER SPIELT?", "Wähle dein Profil für den Solo-Modus.", [], beginSolo, "renderMainMenu");
}

function beginSolo(profile){
  const questions = pickQuestionsForRound(profile.score);
  solo = {
    profile,
    startScore: profile.score,
    questions,
    qIndex: 0,
    timeLimit: getTimeLimit(profile.score),
    correct: 0, wrong: 0, points: 0,
    timerId: null, remaining: 0, answered: false
  };

  renderApp(`
    ${statusbarHtml(profile.score)}
    <div class="panel pass-card">
      <div class="avatar-big" style="background:${avatarColor(profile.name)}">${initials(profile.name)}</div>
      <h2>${profile.name}</h2>
      <p>5 Fragen · ${solo.timeLimit}s pro Frage · Verbessere deinen Punktestand!</p>
      <button class="btn btn-primary" onclick="renderSoloQuestion()">LOS GEHT'S</button>
    </div>
  `);
}

function renderSoloQuestion(){
  const q = solo.questions[solo.qIndex];
  const letters = ["A","B","C","D"];
  solo.answered = false;
  renderApp(`
    ${statusbarHtml(solo.profile.score)}
    <div class="panel">
      <div class="qmeta">
        <div class="qcount">Frage ${solo.qIndex+1} von ${solo.questions.length}</div>
        <div class="qcat">${q.cat}</div>
      </div>
      <div class="timer-wrap">
        <div class="timer-bar"><div id="timerFill" class="timer-fill" style="width:100%"></div></div>
        <div id="timerNum" class="timer-num">${solo.timeLimit}s</div>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="answers">
        ${q.a.map((ans,i)=>`
          <button class="answer-btn" onclick="handleSoloAnswer(${i})">
            <span class="answer-letter">${letters[i]}</span><span>${ans}</span>
          </button>`).join("")}
      </div>
      <div id="explanationBox" class="explanation hidden"></div>
      <div id="nextHint" class="next-hint hidden">Weiter zur nächsten Frage …</div>
    </div>
  `);
  startSoloTimer();
}

function startSoloTimer(){
  solo.remaining = solo.timeLimit;
  updateTimerUI(solo.remaining, solo.timeLimit);
  clearInterval(solo.timerId);
  solo.timerId = setInterval(()=>{
    solo.remaining -= 0.1;
    if(solo.remaining <= 0){
      solo.remaining = 0;
      updateTimerUI(0, solo.timeLimit);
      clearInterval(solo.timerId);
      if(!solo.answered) handleSoloAnswer(null);
    } else {
      updateTimerUI(solo.remaining, solo.timeLimit);
    }
  }, 100);
}
function updateTimerUI(remaining, limit){
  const fill = document.getElementById("timerFill");
  const num = document.getElementById("timerNum");
  if(!fill || !num) return;
  const pct = Math.max(0, (remaining/limit)*100);
  fill.style.width = pct + "%";
  fill.classList.toggle("warn", pct < 30);
  num.textContent = Math.ceil(remaining) + "s";
}

function handleSoloAnswer(selectedIdx){
  if(solo.answered) return;
  solo.answered = true;
  clearInterval(solo.timerId);
  const q = solo.questions[solo.qIndex];
  const isCorrect = selectedIdx === q.c;
  const delta = isCorrect ? 100 : -150;

  if(isCorrect){ solo.correct++; } else { solo.wrong++; }
  solo.points += delta;
  applyPoints(solo.profile, delta);

  document.querySelectorAll(".answer-btn").forEach((btn,i)=>{
    btn.disabled = true;
    if(i===q.c) btn.classList.add("correct");
    else if(i===selectedIdx) btn.classList.add("wrong");
  });
  document.getElementById("statusbar").outerHTML = statusbarHtml(solo.profile.score);

  const explBox = document.getElementById("explanationBox");
  explBox.classList.remove("hidden");
  explBox.textContent = q.e ? q.e : (isCorrect ? "Richtig beantwortet!" : "Das war leider falsch.");
  document.getElementById("nextHint").classList.remove("hidden");

  setTimeout(()=>{
    solo.qIndex++;
    if(solo.qIndex >= solo.questions.length) endSoloRound();
    else renderSoloQuestion();
  }, 2600);
}

function endSoloRound(){
  const bonus = 150;
  applyPoints(solo.profile, bonus);

  const roundWon = solo.correct >= 3;
  solo.profile.roundsPlayed++;
  solo.profile.correctAnswers += solo.correct;
  solo.profile.wrongAnswers += solo.wrong;
  if(roundWon) solo.profile.wins++; else solo.profile.losses++;
  saveProfiles();

  const rankBefore = getRank(solo.startScore);
  const rankAfter = getRank(solo.profile.score);
  const rankChanged = rankBefore.name !== rankAfter.name;
  const nextInfo = getNextRankInfo(solo.profile.score);

  renderApp(`
    ${statusbarHtml(solo.profile.score)}
    <div class="panel">
      <div class="result-title">RUNDE BEENDET</div>
      <div class="result-sub">${roundWon ? "Starke Leistung!" : "Nächstes Mal klappt's besser."}</div>
      ${rankChanged ? `<div class="rank-up-banner">Neuer Rang erreicht: ${rankAfter.name}!</div>` : ``}

      <div class="result-grid">
        <div class="result-item pos"><div class="n">${solo.correct}</div><div class="l">Richtige Antworten</div></div>
        <div class="result-item neg"><div class="n">${solo.wrong}</div><div class="l">Falsche Antworten</div></div>
        <div class="result-item"><div class="n">${solo.points>=0?"+":""}${solo.points}</div><div class="l">Punkte aus Fragen</div></div>
        <div class="result-item pos"><div class="n">+${bonus}</div><div class="l">Rundenbonus</div></div>
      </div>

      <div class="result-item" style="margin-bottom:20px;">
        <div class="n">${solo.profile.score} Punkte</div>
        <div class="l">${rankPillHtml(solo.profile.score)} · ${nextInfo ? `Noch ${nextInfo.pointsNeeded} Punkte bis ${nextInfo.next.name}` : "Höchster Rang erreicht"}</div>
      </div>

      <div class="actions-row">
        <button class="btn btn-primary" onclick="beginSolo(solo.profile)">NOCH EINE RUNDE</button>
        <button class="btn btn-ghost" onclick="renderMainMenu()">HAUPTMENÜ</button>
      </div>
    </div>
  `);
}

/* ============================================================================
   LOKALER MULTIPLAYER (Pass & Play)
   ============================================================================ */
let mp = null;
let mpSetup = { count: 0, chosen: [] };

function startMPFlow(){
  mpSetup = { count: 0, chosen: [] };
  renderApp(`
    <div class="panel">
      <div class="picker-title">LOKALER MULTIPLAYER</div>
      <div class="picker-sub">Wie viele Spieler sitzen an diesem Gerät?</div>
      <div class="count-options">
        <div class="count-btn" onclick="mpSetCount(2)">2<span>Spieler</span></div>
        <div class="count-btn" onclick="mpSetCount(3)">3<span>Spieler</span></div>
        <div class="count-btn" onclick="mpSetCount(4)">4<span>Spieler</span></div>
      </div>
      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-ghost" onclick="renderMainMenu()">ZURÜCK</button>
      </div>
    </div>
  `);
}
function mpSetCount(n){
  mpSetup.count = n;
  mpSetup.chosen = [];
  mpPickNextPlayer();
}
function mpPickNextPlayer(){
  const slot = mpSetup.chosen.length;
  if(slot >= mpSetup.count){ beginMP(mpSetup.chosen); return; }
  const excludeIds = mpSetup.chosen.map(p=>p.id);
  const chips = Array.from({length: mpSetup.count}).map((_,i)=>
    `<div class="slot-chip ${i<slot?'filled':''}">${i<slot ? mpSetup.chosen[i].name : 'Spieler '+(i+1)}</div>`
  ).join("");
  renderProfilePicker(
    `SPIELER ${slot+1} VON ${mpSetup.count}`,
    "Profil auswählen oder einen neuen Spieler anlegen.",
    excludeIds,
    (p) => { mpSetup.chosen.push(p); mpPickNextPlayer(); },
    "startMPFlow"
  );
  const list = document.querySelector(".picker-list");
  if(list) list.insertAdjacentHTML("beforebegin", `<div class="slot-progress">${chips}</div>`);
}

function beginMP(playerProfiles){
  const avgScore = Math.round(playerProfiles.reduce((s,p)=>s+p.score,0) / playerProfiles.length);
  mp = {
    players: playerProfiles.map(p => ({
      profile: p, startScore: p.score,
      roundCorrect:0, roundWrong:0, roundPoints:0
    })),
    questions: pickQuestionsForRound(avgScore),
    qIndex: 0,
    turnIndex: 0,
    currentResults: [], // {correct:bool} pro Spieler für aktuelle Frage
    timerId: null, remaining: 0, timeLimit: 0, answered:false
  };
  renderMPPassScreen();
}

function renderMPPassScreen(){
  const player = mp.players[mp.turnIndex].profile;
  const q = mp.questions[mp.qIndex];
  renderApp(`
    <div class="panel pass-card">
      <div class="avatar-big" style="background:${avatarColor(player.name)}">${initials(player.name)}</div>
      <h2>${player.name.toUpperCase()} IST DRAN</h2>
      <p>Frage ${mp.qIndex+1} von 5 · Gib das Gerät weiter, damit nur ${player.name} die Frage sieht.</p>
      <button class="btn btn-primary" onclick="renderMPQuestion()">BEREIT – FRAGE ANZEIGEN</button>
    </div>
  `);
}

function renderMPQuestion(){
  const playerEntry = mp.players[mp.turnIndex];
  const q = mp.questions[mp.qIndex];
  const letters = ["A","B","C","D"];
  mp.timeLimit = getTimeLimit(playerEntry.profile.score);
  mp.answered = false;

  renderApp(`
    ${statusbarHtml(playerEntry.profile.score)}
    <div class="panel">
      <div class="qmeta">
        <div class="qcount">${playerEntry.profile.name} · Frage ${mp.qIndex+1} von 5</div>
        <div class="qcat">${q.cat}</div>
      </div>
      <div class="timer-wrap">
        <div class="timer-bar"><div id="timerFill" class="timer-fill" style="width:100%"></div></div>
        <div id="timerNum" class="timer-num">${mp.timeLimit}s</div>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="answers">
        ${q.a.map((ans,i)=>`
          <button class="answer-btn" onclick="handleMPAnswer(${i})">
            <span class="answer-letter">${letters[i]}</span><span>${ans}</span>
          </button>`).join("")}
      </div>
    </div>
  `);
  startMPTimer();
}

function startMPTimer(){
  mp.remaining = mp.timeLimit;
  updateTimerUI(mp.remaining, mp.timeLimit);
  clearInterval(mp.timerId);
  mp.timerId = setInterval(()=>{
    mp.remaining -= 0.1;
    if(mp.remaining <= 0){
      mp.remaining = 0;
      updateTimerUI(0, mp.timeLimit);
      clearInterval(mp.timerId);
      if(!mp.answered) handleMPAnswer(null);
    } else {
      updateTimerUI(mp.remaining, mp.timeLimit);
    }
  }, 100);
}

function handleMPAnswer(selectedIdx){
  if(mp.answered) return;
  mp.answered = true;
  clearInterval(mp.timerId);

  const playerEntry = mp.players[mp.turnIndex];
  const q = mp.questions[mp.qIndex];
  const isCorrect = selectedIdx === q.c;
  const delta = isCorrect ? 100 : -150;

  if(isCorrect){ playerEntry.roundCorrect++; } else { playerEntry.roundWrong++; }
  playerEntry.roundPoints += delta;
  applyPoints(playerEntry.profile, delta);
  mp.currentResults.push({ name: playerEntry.profile.name, correct: isCorrect });

  renderApp(`
    <div class="panel confirm-card">
      <div class="points-badge ${isCorrect?'pos':'neg'}">${isCorrect?'+100':'-150'}</div>
      <p style="color:var(--text-dim); margin-top:10px;">Antwort von ${playerEntry.profile.name} gespeichert.</p>
    </div>
  `);

  setTimeout(()=>{
    mp.turnIndex++;
    if(mp.turnIndex >= mp.players.length){
      renderMPResolve();
    } else {
      renderMPPassScreen();
    }
  }, 1300);
}

function renderMPResolve(){
  const q = mp.questions[mp.qIndex];
  renderApp(`
    <div class="panel">
      <div class="picker-title">AUFLÖSUNG</div>
      <div class="picker-sub">Richtige Antwort: ${q.a[q.c]}</div>
      <div class="resolve-list">
        ${mp.currentResults.map(r => `
          <div class="resolve-row">
            <span>${r.name}</span>
            <span class="mark ${r.correct?'ok':'bad'}">${r.correct?'✓':'✕'}</span>
          </div>
        `).join("")}
      </div>
      ${q.e ? `<div class="explanation">${q.e}</div>` : ``}
      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-primary" onclick="mpNextQuestion()">${mp.qIndex+1 >= mp.questions.length ? 'ZUR RUNDENAUSWERTUNG' : 'NÄCHSTE FRAGE'}</button>
      </div>
    </div>
  `);
}

function mpNextQuestion(){
  mp.qIndex++;
  mp.turnIndex = 0;
  mp.currentResults = [];
  if(mp.qIndex >= mp.questions.length){
    endMPRound();
  } else {
    renderMPPassScreen();
  }
}

function endMPRound(){
  const maxPoints = Math.max(...mp.players.map(p=>p.roundPoints));
  const bonus = 150;
  mp.players.forEach(p => {
    p.isWinner = p.roundPoints === maxPoints;
    if(p.isWinner) applyPoints(p.profile, bonus);
    p.profile.roundsPlayed++;
    p.profile.correctAnswers += p.roundCorrect;
    p.profile.wrongAnswers += p.roundWrong;
    if(p.isWinner) p.profile.wins++; else p.profile.losses++;
  });
  saveProfiles();

  const ranked = [...mp.players].sort((a,b)=> (b.roundPoints + (b.isWinner?bonus:0)) - (a.roundPoints + (a.isWinner?bonus:0)));
  const medals = ["🥇","🥈","🥉","4."];

  renderApp(`
    <div class="panel">
      <div class="result-title">RUNDE BEENDET</div>
      <div class="result-sub">Ergebnis nach 5 Fragen</div>
      ${ranked.map((p,i) => {
        const rankBefore = getRank(p.startScore);
        const rankAfter = getRank(p.profile.score);
        const changed = rankBefore.name !== rankAfter.name;
        const total = p.roundPoints + (p.isWinner ? bonus : 0);
        return `
          <div class="leaderboard-row">
            <div class="medal">${medals[i]}</div>
            <div class="avatar-circle" style="background:${avatarColor(p.profile.name)}">${initials(p.profile.name)}</div>
            <div>
              <div class="lname">${p.profile.name} ${p.isWinner ? '👑' : ''}</div>
              <div class="lsub">${p.roundCorrect} richtig · ${p.roundWrong} falsch ${changed ? '· <b style="color:var(--accent-2)">NEU: '+rankAfter.name+'</b>' : ''}</div>
            </div>
            <div class="lright">
              <div class="lpoints">${total>=0?'+':''}${total}</div>
              <div class="lsub">${p.profile.score} Pkt gesamt</div>
            </div>
          </div>`;
      }).join("")}
      <div class="actions-row" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="beginMP(mp.players.map(p=>p.profile))">NOCH EINE RUNDE</button>
        <button class="btn btn-ghost" onclick="renderMainMenu()">HAUPTMENÜ</button>
      </div>
    </div>
  `);
}

/* ============================================================================
   PARTY (WLAN) — echte Vernetzung über den mitgelieferten Node-Server
   ============================================================================ */
let party = null; // {ws, playerId, roomCode, isHost, room, myAnswered}

function wsUrl(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return proto + "//" + location.host;
}

function startPartyFlow(){
  if(location.protocol !== "http:" && location.protocol !== "https:"){
    renderApp(`
      <div class="panel">
        <div class="picker-title">PARTY (WLAN)</div>
        <div class="explanation" style="border-color:var(--danger); color:var(--text);">
          Diese Seite wurde direkt als Datei geöffnet (Adresse beginnt nicht mit <code>http://</code>
          oder <code>https://</code>, sondern z.B. mit <code>file://</code> oder <code>content://</code>).
          Der Party-Modus braucht aber den mitgelieferten Server: Er muss auf einem Computer im
          selben WLAN mit <code>node server.js</code> gestartet werden. Öffne anschließend auf
          <b>diesem</b> Gerät die Adresse, die die Server-Konsole anzeigt
          (z.B. <code>http://192.168.1.23:3000</code>) – nicht die Datei selbst.
        </div>
        <div class="actions-row" style="margin-top:18px;">
          <button class="btn btn-ghost" onclick="renderMainMenu()">ZURÜCK</button>
        </div>
      </div>
    `);
    return;
  }
  renderApp(`
    <div class="panel">
      <div class="picker-title">PARTY (WLAN)</div>
      <div class="picker-sub">Alle Geräte müssen im selben WLAN sein und diese Seite über die Adresse des Hosts geöffnet haben.</div>
      <div class="picker-form" style="margin-bottom:14px;">
        <input id="partyName" type="text" placeholder="Dein Name" maxlength="20">
      </div>
      <div id="partyEntryError" class="explanation hidden" style="border-color:var(--danger);"></div>
      <div class="actions-row" style="margin-bottom:18px;">
        <button id="partyCreateBtn" class="btn btn-primary" onclick="partyCreateRoom()">RAUM ERSTELLEN</button>
      </div>
      <div class="picker-sub">Oder einem bestehenden Raum beitreten:</div>
      <div class="picker-form">
        <input id="partyCode" type="text" placeholder="Raum-Code" maxlength="4" style="text-transform:uppercase;">
        <button id="partyJoinBtn" class="btn btn-primary" onclick="partyJoinRoom()">BEITRETEN</button>
      </div>
      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-ghost" onclick="renderMainMenu()">ZURÜCK</button>
      </div>
    </div>
  `);
}

function partyGetName(){
  const el = document.getElementById("partyName");
  const name = (el && el.value || "").trim();
  return name || "Spieler";
}

function partyShowEntryError(message){
  ["partyCreateBtn","partyJoinBtn"].forEach(id=>{
    const btn = document.getElementById(id);
    if(btn){ btn.disabled = false; btn.textContent = id==="partyCreateBtn" ? "RAUM ERSTELLEN" : "BEITRETEN"; }
  });
  const box = document.getElementById("partyEntryError");
  if(box){ box.classList.remove("hidden"); box.textContent = message; }
  else { alert(message); }
}

function partyConnect(onOpen, onFail){
  let ws;
  try{
    ws = new WebSocket(wsUrl());
  }catch(err){
    onFail("Verbindung zum Server konnte nicht aufgebaut werden (" + err.message + "). Läuft der Server (node server.js) und ist diese Seite über seine http-Adresse geöffnet?");
    return;
  }
  party = { ws, playerId:null, roomCode:null, isHost:false, room:null, myAnswered:false, myRankAnswered:false };

  const timeout = setTimeout(() => {
    if(ws.readyState !== WebSocket.OPEN){
      ws.close();
      party = null;
      onFail("Der Server antwortet nicht. Prüfe, ob 'node server.js' läuft und ob dieses Gerät im selben WLAN ist.");
    }
  }, 5000);

  ws.onopen = () => { clearTimeout(timeout); onOpen(); };
  ws.onmessage = (ev) => partyHandleMessage(JSON.parse(ev.data));
  ws.onclose = () => {
    clearTimeout(timeout);
    const hadSession = party && party.roomCode;
    party = null;
    if(hadSession) renderPartyDisconnected();
  };
  ws.onerror = () => {
    clearTimeout(timeout);
    onFail("Verbindung zum Server fehlgeschlagen. Prüfe, ob 'node server.js' läuft und ob dieses Gerät im selben WLAN wie der Host ist.");
  };
}

function renderPartyDisconnected(){
  renderApp(`
    <div class="panel party-waiting">
      <h2 style="color:var(--text); margin-bottom:8px;">Verbindung verloren</h2>
      <p>Die Verbindung zum Party-Server wurde unterbrochen.</p>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="startPartyFlow()">ZURÜCK ZUR PARTY-AUSWAHL</button>
    </div>
  `);
}

function partyCreateRoom(){
  const name = partyGetName();
  const btn = document.getElementById("partyCreateBtn");
  if(btn){ btn.disabled = true; btn.textContent = "VERBINDE …"; }
  const box = document.getElementById("partyEntryError");
  if(box) box.classList.add("hidden");
  partyConnect(
    () => party.ws.send(JSON.stringify({ action:"createRoom", name })),
    (msg) => partyShowEntryError(msg)
  );
}
function partyJoinRoom(){
  const name = partyGetName();
  const code = (document.getElementById("partyCode").value || "").trim().toUpperCase();
  if(!code) return;
  const btn = document.getElementById("partyJoinBtn");
  if(btn){ btn.disabled = true; btn.textContent = "VERBINDE …"; }
  const box = document.getElementById("partyEntryError");
  if(box) box.classList.add("hidden");
  partyConnect(
    () => party.ws.send(JSON.stringify({ action:"joinRoom", code, name })),
    (msg) => partyShowEntryError(msg)
  );
}
function partySend(msg){ if(party && party.ws) party.ws.send(JSON.stringify(msg)); }
function partyLeave(){ if(party && party.ws) party.ws.close(); party = null; renderMainMenu(); }

function partyHandleMessage(msg){
  if(!party) return;
  switch(msg.type){
    case "joined":
      party.playerId = msg.playerId;
      party.roomCode = msg.roomCode;
      party.isHost = msg.isHost;
      break;
    case "error":
      alert(msg.message);
      break;
    case "roomUpdate":
      party.room = msg;
      if(msg.phase === "lobby") renderPartyLobby();
      break;
    case "roundStart":
      party.myAnswered = false;
      renderPartyRoundIntro(msg);
      break;
    case "quizQuestion":
      party.myAnswered = false;
      renderPartyQuiz(msg);
      break;
    case "quizReveal":
      renderPartyQuizReveal(msg);
      break;
    case "rankState":
      renderPartyRank(msg);
      break;
    case "rankAttempt":
      renderPartyRankAttempt(msg);
      break;
    case "rankReveal":
      renderPartyRankReveal(msg);
      break;
    case "roundEnd":
      renderPartyRoundEnd(msg);
      break;
    case "gameEnd":
      renderPartyGameEnd(msg);
      break;
  }
}

/* ---------- Lobby ---------- */
function renderPartyLobby(){
  const room = party.room;
  const me = room.players.find(p => p.id === party.playerId);
  const isHost = party.isHost;

  const teamModeLabels = { ffa:"Alle gegen alle", "2v2":"2 gegen 2", "3v3":"3 gegen 3", "2v2v2":"2 gegen 2 gegen 2" };

  renderApp(`
    <div class="panel">
      <div class="picker-title">WARTERAUM</div>
      <div class="picker-sub">Andere Geräte treten mit dem Code bei, sobald sie diese Seite im selben WLAN geöffnet haben.</div>
      <div class="code-display">${room.code}</div>

      <div class="settings-row"><span class="label">Teilnehmer</span><span>${room.players.length} / ${room.maxParticipants}</span></div>

      <div class="party-players">
        ${room.players.map(p => `
          <div class="party-player-row ${p.connected ? '' : 'offline'}">
            <span class="dot"></span>
            <span>${p.isBot ? '🤖' : '👤'} ${p.name}${p.id === room.hostId ? ' 👑' : ''}${p.isBot ? ' – ' + p.botTierLabel : ''}</span>
            ${p.teamId ? `<span class="team-tag">${room.teams.find(t=>t.id===p.teamId)?.name || ''}</span>` : ''}
            ${isHost && p.isBot ? `
              <select class="bot-tier-select" onchange="partySetBotTier('${p.id}', this.value)">
                ${room.botTierOptions.map(o=>`<option value="${o.id}" ${o.id===p.botTier?'selected':''}>${o.label}</option>`).join("")}
              </select>
              <button class="bot-remove-btn" onclick="partyRemoveBot('${p.id}')" title="Bot entfernen">✕</button>
            ` : ``}
          </div>
        `).join("")}
      </div>

      ${isHost ? `
        <div class="actions-row" style="margin-bottom:6px;">
          <button class="btn btn-ghost" style="padding:9px 16px; font-size:13px;" onclick="partyAddBot()" ${room.players.length>=room.maxParticipants?'disabled':''}>+ BOT HINZUFÜGEN</button>
        </div>
        <p class="picker-sub" style="margin-bottom:16px;">Bots sind optional. Du kannst auch allein eine Party starten und mehrere Bots als Gegner hinzufügen.</p>
      ` : ``}

      ${isHost ? renderPartyHostSettings(room) : `
        <div class="settings-row"><span class="label">Runden</span><span>${room.roundCount}</span></div>
        <div class="settings-row"><span class="label">Modus-Auswahl</span><span>${room.roundMode === 'random' ? 'Zufallsrunde' : 'Spiel erstellen'}</span></div>
        <div class="settings-row"><span class="label">Teams</span><span>${teamModeLabels[room.teamMode]}</span></div>
        <div class="settings-row"><span class="label">Punktesystem</span><span>${room.pointSystem}</span></div>
        <p style="color:var(--text-dim); text-align:center; margin-top:16px;">Warte auf den Host …</p>
      `}

      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-ghost" onclick="partyLeave()">RAUM VERLASSEN</button>
      </div>
    </div>
  `);
}
function partyAddBot(){ partySend({action:'addBot', tier:'schlau'}); }
function partyRemoveBot(botId){ partySend({action:'removeBot', botId}); }
function partySetBotTier(botId, tier){ partySend({action:'setBotTier', botId, tier}); }


function renderPartyHostSettings(room){
  const teamOptions = [
    {id:'ffa', label:'Alle gegen alle', min:1, max:6},
    {id:'2v2', label:'2 gegen 2', min:4, max:4},
    {id:'3v3', label:'3 gegen 3', min:6, max:6},
    {id:'2v2v2', label:'2 gegen 2 gegen 2', min:6, max:6}
  ];
  const n = room.players.length;

  return `
    <div class="settings-row">
      <span class="label">Anzahl Runden</span>
      <div class="chip-group">
        <div class="chip-btn ${room.roundCount===5?'active':''}" onclick="partySetRoundCount(5)">5</div>
        <div class="chip-btn ${room.roundCount===10?'active':''}" onclick="partySetRoundCount(10)">10</div>
      </div>
    </div>
    <div class="settings-row">
      <span class="label">Rundenauswahl</span>
      <div class="chip-group">
        <div class="chip-btn ${room.roundMode==='random'?'active':''}" onclick="partySetRoundMode('random')">Zufallsrunde</div>
        <div class="chip-btn ${room.roundMode==='custom'?'active':''}" onclick="partySetRoundMode('custom')">Spiel erstellen</div>
      </div>
    </div>
    ${room.roundMode === 'random' ? `
      <div class="settings-row"><span class="label">Runden</span>
        <button class="btn btn-ghost" style="padding:8px 14px; font-size:12px;" onclick="partyRandomizeRounds()">NEU MISCHEN</button>
      </div>
      <div class="round-plan-list">
        ${room.roundDefs.map((r,i)=>`<div class="round-plan-item"><span class="idx">${i+1}</span>${r.label}</div>`).join("")}
      </div>
    ` : `
      <div class="round-plan-list">
        ${Array.from({length:room.roundCount}).map((_,i)=>{
          const current = room.roundDefs[i] ? room.roundDefs[i].id : room.availableRoundDefs[0].id;
          return `
          <div class="round-plan-item">
            <span class="idx">${i+1}</span>
            <select onchange="partySetRoundDef(${i}, this.value)">
              ${room.availableRoundDefs.map(d=>`<option value="${d.id}" ${d.id===current?'selected':''}>${d.label}</option>`).join("")}
            </select>
          </div>`;
        }).join("")}
      </div>
    `}

    <div class="settings-row">
      <span class="label">Teams</span>
      <div class="chip-group">
        ${teamOptions.map(t => `<div class="chip-btn ${room.teamMode===t.id?'active':''} ${n<t.min||n>t.max?'':''}" onclick="partySetTeamMode('${t.id}')">${t.label}</div>`).join("")}
      </div>
    </div>
    ${room.teamMode !== 'ffa' ? `
      <div class="team-slots">
        ${room.teams.map(team => `
          <div class="team-slot-card">
            <h5>${team.name}</h5>
            <div class="members">
              ${room.players.map(p => `
                <button class="team-member-btn ${p.teamId && p.teamId!==team.id ? 'taken':''}" onclick="partyAssignTeam('${p.id}','${team.id}')">
                  ${p.isBot ? '🤖' : '👤'} ${p.name}${p.teamId===team.id ? ' ✓' : ''}
                </button>
              `).join("")}
            </div>
          </div>
        `).join("")}
      </div>
    ` : ``}

    <div class="settings-row">
      <span class="label">Punktesystem</span>
      <div class="chip-group">
        <div class="chip-btn ${room.pointSystem===1?'active':''}" onclick="partySetPointSystem(1)">1: Runde (+1)</div>
        <div class="chip-btn ${room.pointSystem===2?'active':''}" onclick="partySetPointSystem(2)">2: Steigend</div>
        <div class="chip-btn ${room.pointSystem===3?'active':''}" onclick="partySetPointSystem(3)">3: Punkteabzug</div>
      </div>
    </div>

    <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="partySend({action:'startGame'})">SPIEL STARTEN</button>
  `;
}

function partySetRoundCount(n){ partySend({action:'setRoundCount', count:n}); }
function partySetRoundMode(mode){ partySend({action:'setRoundMode', mode}); }
function partyRandomizeRounds(){ partySend({action:'randomizeRounds'}); }
function partySetRoundDef(index, defId){ partySend({action:'setRoundDef', index, defId}); }
function partySetTeamMode(teamMode){ partySend({action:'setTeamMode', teamMode}); }
function partyAssignTeam(playerId, teamId){ partySend({action:'assignTeam', playerId, teamId}); }
function partySetPointSystem(system){ partySend({action:'setPointSystem', system}); }

/* ---------- Rundenintro ---------- */
function renderPartyRoundIntro(msg){
  renderApp(`
    <div class="panel pass-card">
      <h2>RUNDE ${msg.roundNumber} VON ${msg.totalRounds}</h2>
      <p>${msg.label}</p>
    </div>
  `);
}

/* ---------- Quiz ---------- */
function renderPartyQuiz(msg){
  const letters = ["A","B","C","D"];
  renderApp(`
    <div class="panel">
      <div class="qmeta">
        <div class="qcount">Frage ${msg.index+1} von ${msg.total}</div>
        <div class="qcat">${msg.cat}</div>
      </div>
      <div class="question-text">${msg.q}</div>
      <div class="answers">
        ${msg.a.map((ans,i)=>`
          <button class="answer-btn" onclick="partyAnswerQuiz(${i})">
            <span class="answer-letter">${letters[i]}</span><span>${ans}</span>
          </button>`).join("")}
      </div>
      <div id="partyQuizStatus" class="next-hint"></div>
    </div>
  `);
}
function partyAnswerQuiz(idx){
  if(party.myAnswered) return;
  party.myAnswered = true;
  document.querySelectorAll(".answer-btn").forEach(b=>b.disabled = true);
  const status = document.getElementById("partyQuizStatus");
  if(status){ status.classList.remove("hidden"); status.textContent = "Antwort gesendet – warte auf die anderen Spieler …"; }
  partySend({action:'quizAnswer', selectedIndex: idx});
}
function renderPartyQuizReveal(msg){
  const letters = ["A","B","C","D"];
  renderApp(`
    <div class="panel">
      <div class="picker-title">AUFLÖSUNG</div>
      <div class="picker-sub">Richtige Antwort: ${letters[msg.correctIndex]}</div>
      <div class="resolve-list">
        ${msg.results.map(r => `
          <div class="resolve-row">
            <span>${r.name}</span>
            <span class="mark ${r.correct?'ok':'bad'}">${r.correct?'✓ +100':'✕ -150'}</span>
          </div>
        `).join("")}
      </div>
      ${msg.explanation ? `<div class="explanation">${msg.explanation}</div>` : ``}
    </div>
  `);
}

/* ---------- Einordnen / Mehr oder Weniger ---------- */
function renderPartyRank(msg){
  const myTeamId = party.room.players.find(p=>p.id===party.playerId)?.teamId;
  const myTurn = msg.turnTeamId === myTeamId;
  const turnTeam = party.room.teams.find(t=>t.id===msg.turnTeamId);

  const livesHtml = Object.entries(msg.lives).map(([teamId, lives]) => {
    const team = party.room.teams.find(t=>t.id===teamId);
    const hearts = Array.from({length:3}).map((_,i)=>`<span class="heart ${i<lives?'on':''}">❤</span>`).join("");
    return `<div class="lives-row"><span>${team?.name || teamId}${msg.eliminated.includes(teamId)?' (raus)':''}</span><div class="hearts">${hearts}</div></div>`;
  }).join("");

  renderApp(`
    <div class="panel">
      <div class="picker-title">${msg.label}</div>
      <div class="picker-sub">${msg.unit} · ${msg.order === 'desc' ? 'Höchster Wert zuerst' : 'Niedrigster Wert zuerst'}</div>

      <div class="turn-banner">${myTurn ? 'IHR SEID DRAN!' : (turnTeam?.name || '...') + ' ist dran'}</div>

      ${msg.currentItem ? `
        <div class="current-item-card">
          <div style="color:var(--text-dim); font-size:12px;">Aktuelles Element</div>
          <div class="name">${msg.currentItem.name}</div>
        </div>
      ` : ``}

      <div class="rank-board">
        ${myTurn && msg.currentItem ? `<button class="insert-btn" onclick="partyRankPlace(0)">Hier einordnen (an erster Stelle)</button>` : ``}
        ${msg.placed.map((item, i) => `
          <div class="rank-item-row">
            <span>${item.name}</span>
            ${item.value !== undefined ? `<span class="val">${item.value}</span>` : ``}
          </div>
          ${myTurn && msg.currentItem ? `<button class="insert-btn" onclick="partyRankPlace(${i+1})">Hier einordnen</button>` : ``}
        `).join("")}
      </div>

      <div style="margin-top:18px;">${livesHtml}</div>
    </div>
  `);
}
function partyRankPlace(insertIndex){
  document.querySelectorAll(".insert-btn").forEach(b=>b.disabled = true);
  partySend({action:'rankPlace', insertIndex});
}
function renderPartyRankAttempt(msg){
  const team = party.room.teams.find(t=>t.id===msg.teamId);
  renderApp(`
    <div class="panel confirm-card">
      <div class="points-badge ${msg.correct?'pos':'neg'}">${msg.correct?'✓ RICHTIG':'✕ FALSCH'}</div>
      <p style="margin-top:10px; font-weight:700;">${team?.name || ''}: ${msg.itemName}</p>
      ${msg.value !== undefined ? `<p style="color:var(--text-dim);">Wert: ${msg.value}</p>` : ``}
    </div>
  `);
}
function renderPartyRankReveal(msg){
  renderApp(`
    <div class="panel">
      <div class="picker-title">AUFLÖSUNG: ${msg.label}</div>
      <div class="rank-board" style="margin-top:14px;">
        ${msg.fullOrder.map(item => `
          <div class="rank-item-row"><span>${item.name}</span><span class="val">${item.value} ${msg.unit}</span></div>
        `).join("")}
      </div>
    </div>
  `);
}

/* ---------- Rundenauswertung & Spielende ---------- */
function renderPartyRoundEnd(msg){
  const ranked = [...msg.teams].sort((a,b)=>b.score-a.score);
  const medals = ["🥇","🥈","🥉","4.","5.","6."];
  renderApp(`
    <div class="panel">
      <div class="result-title">RUNDE ${msg.roundNumber} BEENDET</div>
      ${ranked.map((t,i) => `
        <div class="leaderboard-row">
          <div class="medal">${medals[i]}</div>
          <div>
            <div class="lname">${t.name}${msg.winnerTeamIds.includes(t.id) ? ' 👑' : ''}</div>
            <div class="lsub">Rundenpunkte: ${msg.roundScores[t.id] >= 0 ? '+' : ''}${msg.roundScores[t.id]}</div>
          </div>
          <div class="lright"><div class="lpoints">${t.score}</div><div class="lsub">Gesamt</div></div>
        </div>
      `).join("")}
      ${party.isHost ? `
        <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="partySend({action:'continue'})">
          ${msg.isLastRound ? 'ZUR ENDAUSWERTUNG' : 'NÄCHSTE RUNDE'}
        </button>
      ` : `<p style="color:var(--text-dim); text-align:center; margin-top:14px;">Warte auf den Host …</p>`}
    </div>
  `);
}

function renderPartyGameEnd(msg){
  const medals = ["🥇","🥈","🥉","4.","5.","6."];
  renderApp(`
    <div class="panel">
      <div class="result-title">SPIEL BEENDET</div>
      ${msg.ranking.map((t,i) => `
        <div class="leaderboard-row">
          <div class="medal">${medals[i]}</div>
          <div class="lname">${t.name}</div>
          <div class="lright"><div class="lpoints">${t.score}</div><div class="lsub">Punkte</div></div>
        </div>
      `).join("")}
      <div class="actions-row" style="margin-top:14px;">
        ${party.isHost ? `<button class="btn btn-primary" onclick="partySend({action:'restartLobby'})">ZURÜCK ZUM WARTERAUM</button>` : ``}
        <button class="btn btn-ghost" onclick="partyLeave()">RAUM VERLASSEN</button>
      </div>
    </div>
  `);
}

/* ---------------------------------- START ---------------------------------- */
renderMainMenu();
</script>
</body>
</html>
